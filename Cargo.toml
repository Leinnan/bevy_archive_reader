[package]
name = "bevy_archive_reader"
version = "0.4.0"
edition = "2024"
authors = ["Piotr Siuszko"]
keywords = ["bevy", "assets", "archive"]
description = "Reading archives as source of assets in Bevy"
license = "MIT OR Apache-2.0"

[features]
default = []
bundler = ["dep:walkdir"]

[dependencies]
bevy_app = { version = "0.19" }
bevy_reflect = { version = "0.19" }
bevy_asset = { version = "0.19" }
bevy_log = { version = "0.19" }
zip = { version = "7.0.0", default-features = false, features = ["aes-crypto", "xz", "deflate-flate2-zlib-rs"] }
async-lock = "3"
futures-lite = "2.0.1"
walkdir = {optional = true, version ="2"}

[target.'cfg(target_arch = "wasm32")'.dependencies]
# zip's aes-crypto pulls getrandom; the web backend also needs
# `--cfg getrandom_backend="wasm_js"` in RUSTFLAGS.
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy_android = { version = "0.19" }
bevy_winit = { version = "0.19" }

[dev-dependencies]
zip = { version = "7.0.0", default-features = false }
